<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot Size Finder</title>
<style>
  html, body { height: 100%; }
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 12px; box-sizing: border-box;
         position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; display: flex; flex-direction: column; }
  .card { width: 100%; max-width: 420px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.15); flex: none; }
  .title { background: #f1c40f; padding: 12px; font-weight: bold; font-size: 18px; }
  .row { display: flex; border-bottom: 1px solid #ddd; }
  .label { flex: 1; background: #8e92b5; padding: 12px; font-weight: bold; }
  .value { flex: 1; display: flex; }
  .value input, .value output { width: 100%; box-sizing: border-box; padding: 12px; border: 0; text-align: right; font-size: 16px; background: #fff; }
  .value input:focus { outline: 2px solid #4a90d9; }
  .result .value output { background: #57b80f; font-weight: bold; }
  .msg { background: #5b9bd5; color: #f1c40f; text-align: center; font-size: 26px; font-weight: bold; padding: 30px 10px; }

  /* Trading panel: fills the empty space under the card (where the keyboard opens) */
  .panel { width: 100%; max-width: 420px; margin: 12px auto 0; flex: 1; min-height: 0; overflow: hidden; position: relative;
           background: #14182b; color: #e8e8f0; border-radius: 8px; padding: 12px; box-sizing: border-box; }
  .tip { margin-top: 0; font-size: 15px; line-height: 1.4; transition: opacity .4s; position: relative; z-index: 1; }
  .candles { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 45%; opacity: .35; pointer-events: none; }

  /* Desktop / installed window: only as big as the content, no panel */
  @media (hover: hover) and (pointer: fine) and (min-width: 700px) {
    html, body { height: auto; }
    body { position: static; overflow: hidden; }
    .panel { display: none; }
  }
</style>
<meta name="theme-color" content="#f1c40f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="card">
  <div class="title">Lot Size Finder</div>

  <div class="row"><div class="label">Account balance</div>
    <div class="value"><input id="balance" type="number" step="any" value="5000"></div></div>

  <div class="row"><div class="label">Risk%</div>
    <div class="value"><input id="riskPct" type="number" step="any" value="0.25"></div></div>

  <div class="row"><div class="label">Risk Amount</div>
    <div class="value"><output id="riskAmt">12.5</output></div></div>

  <div class="row"><div class="label">SL on 0.01</div>
    <div class="value"><input id="sl" type="number" step="any" value="3"></div></div>

  <div class="row result"><div class="label">Lot Size</div>
    <div class="value"><output id="lot">0.04</output></div></div>

  <div class="msg">Good luck to me 👍😎</div>
</div>

<div class="panel" aria-hidden="true">
  <div class="tip" id="tip"></div>
  <svg class="candles" viewBox="0 0 200 60" preserveAspectRatio="none">
    <g stroke-width="1">
      <g stroke="#57d40f" fill="#57d40f"><path d="M12 14V50M28 8V40M60 12V34M92 6V30M124 2V28M172 4V26" fill="none"/><rect x="9" y="22" width="6" height="18"/><rect x="25" y="14" width="6" height="16"/><rect x="57" y="16" width="6" height="12"/><rect x="89" y="10" width="6" height="14"/><rect x="121" y="6" width="6" height="14"/><rect x="169" y="8" width="6" height="12"/></g>
      <g stroke="#ff5c5c" fill="#ff5c5c"><path d="M44 20V52M76 18V54M108 14V46M140 8V40M156 14V44M188 8V36" fill="none"/><rect x="41" y="26" width="6" height="16"/><rect x="73" y="26" width="6" height="18"/><rect x="105" y="20" width="6" height="14"/><rect x="137" y="14" width="6" height="16"/><rect x="153" y="20" width="6" height="14"/><rect x="185" y="14" width="6" height="14"/></g>
    </g>
  </svg>
</div>

<script>
  const $ = id => document.getElementById(id);

  function calculate() {
    const balance = parseFloat($('balance').value) || 0;
    const riskPct = parseFloat($('riskPct').value) || 0;
    const sl = parseFloat($('sl').value) || 0;

    // Risk Amount = input1 * (input2 / 100)
    const riskAmount = balance * (riskPct / 100);
    $('riskAmt').value = +riskAmount.toFixed(4);

    // Lot Size = ROUNDDOWN((Risk Amount / input3) * 0.01, 2)
    let lot = 0;
    if (sl > 0) {
      const raw = (riskAmount / sl) * 0.01;
      lot = Math.floor(raw * 100 + 1e-9) / 100;
    }
    $('lot').value = lot.toFixed(2);

  }

  ['balance', 'riskPct', 'sl'].forEach(id => $(id).addEventListener('input', calculate));
  calculate();

  // Rotating trading rules
  const tips = [
    'Never risk more than 1-2% of your account on a single trade.',
    'Always set a stop loss before you enter a trade.',
    'Plan the trade, then trade the plan.',
    'Protect your capital first, profits come second.',
    'A 1:2 risk-reward needs only 34% win rate to break even.',
    'No setup? No trade. Waiting is also a position.',
    'Do not revenge trade. Take a break after a loss.',
    'Let winners run, cut losers short.',
    'Consistency beats big wins. Follow your rules every day.',
    'Check the news calendar before trading high-impact events.'
  ];
  let t = Math.floor(Math.random() * tips.length);
  const tipEl = $('tip');
  tipEl.textContent = tips[t];
  setInterval(() => {
    tipEl.style.opacity = 0;
    setTimeout(() => { t = (t + 1) % tips.length; tipEl.textContent = tips[t]; tipEl.style.opacity = 1; }, 400);
  }, 6000);

  // Installed desktop window: shrink to fit the content only
  (function fitWindow() {
    const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches;
    const desktop = matchMedia('(hover: hover) and (pointer: fine) and (min-width: 700px)').matches;
    if (!standalone || !desktop || !window.resizeTo) return;
    const fit = () => {
      const w = Math.ceil($('balance').closest('.card').offsetWidth + 24);
      const h = Math.ceil(document.body.scrollHeight);
      window.resizeTo(w + (window.outerWidth - window.innerWidth), h + (window.outerHeight - window.innerHeight));
    };
    fit();
    window.addEventListener('load', fit);
  })();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
